name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: python -m pip check
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: ['chromium', 'webkit']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python scripts/check_web_browser.py --browser ${{ matrix.browser }} --output output/browser-${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: output/browser-${{ matrix.browser }}/
